[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interventions-avsi"
version = "0.1.0"
description = "Token-space interventions on RVQ speech language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "matplotlib>=3.7",
    "praatio>=6.0",
    "praat-parselmouth>=0.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "soundfile>=0.12",
    "librosa>=0.10",
]

[project.optional-dependencies]
# Contour clustering (analysis/tune_shapes.py and the analysis/matrix/ scripts that use it).
# Installed in the Fish S2 environment only, which is where those scripts run.
curves = ["scikit-fda>=0.10", "diptest>=0.8"]
# CSM's generator code (generation.csm_package) needs torchtune; the S2 half needs fish-speech,
# built as docs/fish-s2-environment.md describes. The two pin different torch versions and are
# never installed together.
csm = ["torchtune>=0.4"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
